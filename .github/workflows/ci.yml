name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m pytest -q
      - run: aicontrolhub demo --database /tmp/aicontrolhub-ci.sqlite3
      - run: aicontrolhub verify --database /tmp/aicontrolhub-ci.sqlite3
